<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     role="img" aria-labelledby="title desc">
  <title id="title">Trenchcoat of corgis</title>
  <desc id="desc">A smiling man in a teal fedora holds open his trenchcoat
    to reveal six golden corgis arranged in two rows of three.</desc>

  <!-- One small hand-authored dog shape, reused locally six times. -->
  <defs>
    <g id="corgi">
      <path fill="#ffbe35" stroke="#382315" stroke-width="1.2"
            stroke-linejoin="round" d="M 2 19 L 1 6
        Q 1 3 4 5 L 9 9 Q 14 7 19 9 L 24 5
        Q 27 3 27 6 L 26 19 Q 27 29 14 35 Q 1 29 2 19 Z"/>
      <path fill="#fff3d6" d="M 4 17 L 3 7 L 9 12 Z
        M 19 12 L 25 7 L 24 17 Z"/>
      <path fill="#fff3d6" d="M 12 14 Q 14 9 16 14 L 18 22
        L 25 24 Q 24 32 14 35 Q 4 32 3 24 L 10 22 Z"/>
      <g fill="#382315">
        <ellipse cx="8" cy="20" rx="1.3" ry="1.8"/>
        <ellipse cx="20" cy="20" rx="1.3" ry="1.8"/>
        <path d="M 11 24 Q 14 21 17 24 Q 17 26 14 27 Q 11 26 11 24 Z"/>
      </g>
      <path fill="none" stroke="#382315" stroke-width="1.2"
            stroke-linecap="round" d="M 14 26 V 29
        M 9 28 Q 11 32 14 29 Q 17 32 19 28"/>
    </g>
  </defs>

  <path id="coat" fill="#276e69" stroke="#382315" stroke-width="3"
        stroke-linejoin="round" d="M 42 37 L 34 43 L 9 49
    L 6 119 L 24 118 L 33 108 H 95 L 104 118 L 122 119
    L 119 49 L 94 43 L 86 37 Z"/>
  <path id="coat-interior" fill="#194b49" d="M 20 53
    Q 64 44 108 53 L 105 116 H 23 Z"/>
  <g id="lapels" fill="#276e69" stroke="#382315" stroke-width="2"
     stroke-linejoin="round">
    <path d="M 44 37 L 35 43 L 48 49 L 39 53 L 59 57 L 64 44 Z"/>
    <path d="M 84 37 L 93 43 L 80 49 L 89 53 L 69 57 L 64 44 Z"/>
  </g>

  <path id="face" fill="#f1b486" stroke="#382315" stroke-width="2.5"
        stroke-linejoin="round" d="M 45 21 H 83 V 28
    Q 89 27 88 34 Q 87 38 82 37
    Q 79 46 64 47 Q 49 46 46 37
    Q 41 38 40 34 Q 39 27 45 28 Z"/>
  <g id="man-expression" fill="#382315">
    <ellipse cx="57" cy="31" rx="1.5" ry="2.5"/>
    <ellipse cx="71" cy="31" rx="1.5" ry="2.5"/>
  </g>
  <path id="man-smile" fill="none" stroke="#382315" stroke-width="2"
        stroke-linecap="round" d="M 57 39 Q 64 44 71 39"/>
  <g id="hat" fill="#276e69" stroke="#382315" stroke-width="2.5"
     stroke-linejoin="round">
    <path id="hat-crown" d="M 44 19 L 48 5 Q 50 2 56 5
      Q 64 10 72 5 Q 78 2 80 5 L 84 19 Z"/>
    <ellipse id="hat-brim" cx="64" cy="21" rx="27" ry="5"/>
  </g>
  <path id="hat-band" fill="#194b49" d="M 46 14 Q 64 18 82 14
    L 84 19 Q 64 23 44 19 Z"/>

  <g id="hands" fill="#f1b486" stroke="#382315" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path id="hand-left" d="M 12 47 Q 7 43 7 48
      Q 1 47 3 52 Q 0 56 5 58 Q 4 62 10 62
      L 15 58 Q 20 54 16 51 Z"/>
    <path id="hand-right" transform="translate(128 0) scale(-1 1)" d="M 12 47
      Q 7 43 7 48 Q 1 47 3 52 Q 0 56 5 58 Q 4 62 10 62
      L 15 58 Q 20 54 16 51 Z"/>
  </g>

  <g id="corgis">
    <use id="corgi-top-left" href="#corgi" transform="translate(20 51)"/>
    <use id="corgi-top-middle" href="#corgi" transform="translate(50 51)"/>
    <use id="corgi-top-right" href="#corgi" transform="translate(80 51)"/>
    <use id="corgi-bottom-left" href="#corgi" transform="translate(20 81)"/>
    <use id="corgi-bottom-middle" href="#corgi" transform="translate(50 81)"/>
    <use id="corgi-bottom-right" href="#corgi" transform="translate(80 81)"/>
  </g>
  <g id="feet" fill="#194b49" stroke="#382315" stroke-width="2">
    <path d="M 47 117 H 57 V 124 H 42 Q 40 118 47 117 Z"/>
    <path d="M 71 117 H 81 Q 88 118 86 124 H 71 Z"/>
  </g>
</svg>
