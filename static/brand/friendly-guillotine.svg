<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     role="img" aria-labelledby="title desc">
  <title id="title">Friendly guillotine</title>
  <desc id="desc">A cheerful wooden guillotine with a broad silver blade,
    gold rope and bolts, a smiling face, white cartoon gloves, brown shoes,
    and a teal bow tie with yellow and coral dots and a green knot.</desc>

  <g id="legs" fill="#bf7629" stroke="#382315" stroke-width="3"
     stroke-linejoin="round">
    <path d="M 41 108 H 48 L 46 117 H 39 Z"/>
    <path transform="translate(8 0)" d="M 80 109 H 87 L 90 118 H 83 Z"/>
  </g>
  <g id="shoes" fill="#9b581f" stroke="#382315" stroke-width="3"
     stroke-linejoin="round">
    <path id="shoe-left" d="M 38 116 Q 29 116 29 121
      Q 36 125 47 122 L 51 122 V 118 Q 47 114 38 116 Z"/>
    <path id="shoe-right" transform="translate(8 0)" d="M 83 117 Q 90 115 97 118
      Q 100 120 99 123 Q 89 126 79 122 L 80 118 Z"/>
  </g>
  <g id="ankle-cuffs" fill="#fff3d6" stroke="#382315" stroke-width="2.5">
    <ellipse cx="43" cy="115.5" rx="5" ry="2.5"/>
    <ellipse cx="92.5" cy="116.5" rx="5" ry="2.5"/>
  </g>

  <!-- Arms sit behind the frame; gloves remain outside its silhouette. -->
  <g id="arms" fill="#bf7629" stroke="#382315" stroke-width="3"
     stroke-linejoin="round">
    <path id="arm-left" d="M 38 84 Q 30 81 24 75 L 20 80
      Q 27 88 37 91 Z"/>
    <path id="arm-right" transform="translate(5 0)" d="M 100 79 Q 112 81 117 87
      Q 120 91 110 97 L 105 92 L 111 87 L 98 85 Z"/>
  </g>
  <g id="gloves" fill="#fff3d6" stroke="#382315" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path id="glove-left" d="M 24 73
      C 23 69 20 67 20 63 Q 20 59 17 59 Q 13 59 14 65
      L 14 68 L 10 66 Q 6 63 4 66 Q 2 68 5 70
      Q 3 72 6 74 L 14 79 Q 21 82 25 78 Q 28 76 24 73 Z"/>
    <path id="glove-right" transform="translate(5 0)" d="M 106 92
      C 101 91 98 96 99 101 Q 99 107 106 106
      L 111 105 Q 116 103 113 100 Q 116 97 112 96
      L 109 95 Q 111 92 106 92 Z"/>
    <g fill="none" stroke-width="2">
      <path d="M 5 70 Q 9 69 13 73 M 15 73 Q 18 71 21 74"/>
      <path transform="translate(5 0)" d="M 107 96 Q 106 100 111 100
        M 105 102 Q 109 104 112 102"/>
    </g>
  </g>

  <g id="rope" transform="translate(5 0)" fill="none" stroke-linecap="round">
    <path stroke="#382315" stroke-width="6" d="M 111 27 L 108.5 61"/>
    <path stroke="#ffbe35" stroke-width="3.5" d="M 111 27 L 108.5 61"/>
    <path stroke="#382315" stroke-width="1.5" d="M 109.5 33 L 112 30
      M 109 40 L 111.5 37 M 108.5 47 L 111 44 M 108 54 L 110.5 51"/>
  </g>
  <g id="rope-pull" transform="translate(5 0)" stroke="#382315" stroke-width="2.5"
     stroke-linejoin="round">
    <circle fill="#9b581f" cx="108" cy="65" r="4.5"/>
    <path fill="#ffbe35" d="M 105 70 H 111 V 73 H 105 Z"/>
    <path fill="#ffbe35" d="M 105 73 H 111 L 113 79
      Q 108 83 102 79 Z"/>
  </g>

  <!-- One broad, sloping blade replaces the reference's painted texture. -->
  <g id="blade" transform="translate(0 -4)" stroke="#382315" stroke-width="3"
     stroke-linejoin="round">
    <path id="blade-steel" fill="#c4d0d9" d="M 61 42 H 95 V 52
      C 83 63 66 68 49 70 L 52 49 Q 58 47 61 42 Z"/>
    <path id="blade-bevel" fill="#eef3ef" stroke="none" d="M 50.5 61
      Q 75 57 94 46 V 51 Q 76 65 49.5 68.5 Z"/>
    <path id="blade-highlight" fill="#eef3ef" stroke="none" d="M 62 44
      H 70 L 53 58 L 54 50 Q 59 48 62 44 Z"/>
  </g>
  <path id="blade-hanger" fill="#ffbe35" stroke="#382315" stroke-width="2.5"
        stroke-linejoin="round" d="M 70 23 H 75 L 74 35 H 69 Z"/>
  <path id="hanger-twist" fill="none" stroke="#382315" stroke-width="1.5"
        d="M 70 28 L 74 25 M 69.5 33 L 74 30"/>
  <path id="blade-carriage" fill="#bf7629" stroke="#382315" stroke-width="3"
        stroke-linejoin="round" d="M 57 34 L 89 33 V 43 L 56 44 Z"/>
  <g id="carriage-bolts" fill="#ffbe35" stroke="#382315" stroke-width="2">
    <circle cx="63" cy="39" r="2.5"/>
    <circle cx="82" cy="38.5" r="2.5"/>
  </g>

  <g id="stocks" stroke="#382315" stroke-width="3" stroke-linejoin="round">
    <path id="stocks-front" fill="#bf7629" d="M 43 75
      Q 54 75 61 69 Q 73 60 85 69 Q 90 73 100 75
      L 97 113 H 40 Z"/>
    <path id="stocks-seam" fill="none" d="M 43 86 H 96"/>
  </g>
  <!-- Face and bow share the opening's centerline: x = 79.05 - 0.075y. -->
  <g id="face" transform="matrix(1 0 -0.075 1 72.6 86)">
    <ellipse id="face-oval" fill="#fff3d6" stroke="#382315" stroke-width="2.5"
             cx="0" cy="0" rx="15.5" ry="16"/>
    <g id="eyes" fill="#fffdf6" stroke="#382315" stroke-width="2">
      <ellipse cx="-6.5" cy="-5.5" rx="5.5" ry="7"/>
      <ellipse cx="6.5" cy="-5.5" rx="5.5" ry="7"/>
    </g>
    <g id="pupils" fill="#382315">
      <ellipse cx="-6" cy="-4" rx="2.7" ry="4"/>
      <ellipse cx="7" cy="-4" rx="2.7" ry="4"/>
    </g>
    <g id="eye-glints" fill="#fffdf6">
      <circle cx="-5.5" cy="-5.5" r="1"/>
      <circle cx="7.5" cy="-5.5" r="1"/>
    </g>
    <g id="brows" fill="none" stroke="#382315" stroke-width="2.5"
       stroke-linecap="round">
      <path d="M -10 -16 Q -7 -19 -3 -17
        M 3 -17 Q 7 -19 10 -16"/>
    </g>
    <path id="smile" fill="#382315" d="M -10 3 Q 0 8 10 3
      Q 8 14 0 14 Q -8 14 -10 3 Z"/>
    <path id="tongue" fill="#f5754d" d="M -4 12
      Q -4 8 0 9 Q 4 6 7 9 Q 4 13 0 13 Z"/>
  </g>

  <g id="frame" stroke="#382315" stroke-width="3" stroke-linejoin="round">
    <path id="post-left-side" fill="#9b581f" d="M 53 27 L 54 28
      L 48 109 L 47 109 Z"/>
    <path id="post-left" fill="#bf7629" d="M 42 27 H 53 L 47 109 H 35 Z"/>
    <path id="post-right-side" fill="#9b581f" d="M 111 23 L 114 26
      L 107 110 L 104 113 L 105 110 Z"/>
    <path id="post-right" fill="#bf7629" d="M 100 27 L 111 23
      L 105 110 L 93.85 109 Z"/>
    <path id="foot-left" fill="#bf7629" d="M 31 108 L 36 106
      L 49 108 V 114 H 31 Z"/>
    <path id="foot-right-side" fill="#9b581f" d="M 106 108 L 110 106
      L 111 113 L 105 117 Z"/>
    <path id="foot-right" fill="#bf7629" d="M 90 109 L 95 107
      L 106 109 L 105 117 L 88 116 Z"/>
  </g>

  <g id="bow-tie" transform="matrix(1 0 -0.075 1 70.9875 107.5)"
     stroke="#382315" stroke-width="2.5"
     stroke-linejoin="round">
    <path id="bow-left" fill="#27b7c2" d="M -2 -1
      C -8 -5 -12 -6 -14 -4 Q -16 0 -14 5
      Q -11 7 -2 2 Z"/>
    <path id="bow-right" fill="#27b7c2" d="M 2 -1
      C 8 -5 12 -6 14 -4 Q 16 0 14 5
      Q 11 7 2 2 Z"/>
    <g id="bow-dots" stroke="none">
      <circle fill="#ffbe35" cx="-12" cy="0" r="2"/>
      <circle fill="#f5754d" cx="-8" cy="-3" r="2"/>
      <circle fill="#f5754d" cx="-8" cy="3" r="1.8"/>
      <circle fill="#ffbe35" cx="8" cy="-2" r="2"/>
      <circle fill="#f5754d" cx="12" cy="-2" r="1.8"/>
      <circle fill="#ffbe35" cx="11" cy="3" r="2"/>
    </g>
    <ellipse id="bow-knot" fill="#7fbc47" cx="0" cy="0" rx="3.5" ry="4"/>
  </g>

  <g id="top-beam" stroke="#382315" stroke-width="3" stroke-linejoin="round">
    <circle id="finial" fill="#ffbe35" cx="72" cy="7.5" r="4.5"/>
    <path id="beam-side" fill="#9b581f" d="M 105 14 L 112 18
      V 27 L 108 30 L 108 18 Z"/>
    <path id="beam-front" fill="#bf7629" d="M 40 18
      C 51 20 58 11 72 12 C 84 12 88 18 99 15
      L 105 14 Q 109 13 109 18 L 108 27 L 99 29
      C 87 32 83 25 71 25 C 58 24 52 29 41 30
      Q 37 30 37 26 V 22 Q 37 18 40 18 Z"/>
  </g>
  <g id="frame-bolts" fill="#ffbe35" stroke="#382315" stroke-width="2">
    <circle cx="44" cy="24" r="2.5"/>
    <circle cx="101" cy="21" r="2.5"/>
    <circle cx="41" cy="103" r="2.5"/>
    <circle cx="100" cy="103.5" r="2.5"/>
  </g>
</svg>
